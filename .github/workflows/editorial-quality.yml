name: Editorial quality review
on:
  push:
    branches: [design/editorial-mastiha]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: editorial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ESLINT_USE_FLAT_CONFIG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:ui
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Record existing production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --json > dependency-audit.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-browser-review
          path: |
            test-results/
            playwright-report/
            dependency-audit.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Source snapshot for review
        if: always()
        run: tar -czf editorial-source-review.tar.gz src public messages scripts tests package.json package-lock.json next.config.ts playwright.config.ts tsconfig.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-source-review
          path: editorial-source-review.tar.gz
          retention-days: 1
