name: Import reviewed owner photographs
on:
  push:
    branches: [design/editorial-mastiha]
    paths: ['.github/workflows/import-reviewed-photos.yml', 'scripts/import-reviewed-photos.mjs']
permissions:
  contents: read
  actions: read
jobs:
  import:
    if: github.ref == 'refs/heads/design/editorial-mastiha'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: listing-media-full-review
          run-id: 35617641427
          github-token: ${{ github.token }}
          path: /tmp/listing-full
      - run: node scripts/import-reviewed-photos.mjs /tmp/listing-full
      - name: Commit only the reviewed photographs and catalogue
        run: |
          test "$GITHUB_REF" = 'refs/heads/design/editorial-mastiha'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/photography/airbnb src/content/stay-media.generated.json
          if ! git diff --cached --quiet; then
            git commit -m 'media: import 24 real Airbnb photographs with responsive variants and provenance'
            git push origin HEAD:refs/heads/design/editorial-mastiha
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: imported-photo-catalogue
          path: src/content/stay-media.generated.json
          retention-days: 7
