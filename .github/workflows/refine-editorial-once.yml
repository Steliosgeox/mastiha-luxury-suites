name: Resolve editorial patch once
on:
  push:
    branches: [design/editorial-mastiha]
    paths:
      - '.github/workflows/refine-editorial-once.yml'
      - 'scripts/refine-editorial-once.mjs'
permissions:
  contents: write
jobs:
  resolve:
    if: github.ref == 'refs/heads/design/editorial-mastiha'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refine-editorial-once.mjs
      - name: Generate the npm lockfile without executing dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Persist only the reviewed patch files on the editorial branch
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          actual="$(git ls-remote origin refs/heads/design/editorial-mastiha | cut -f1)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/redesign/StayFilm.tsx src/components/redesign/StayExperience.tsx src/components/redesign/MastihaOdisej.tsx tests/dock.spec.ts package.json package-lock.json
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden film readiness and booking focus; update audited Next 15 image dependencies'
          git push origin HEAD:refs/heads/design/editorial-mastiha
