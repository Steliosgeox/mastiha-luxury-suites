name: Integrate and verify Mastiha neighbourhood assistant
on:
  push:
    branches: [design/editorial-mastiha]
    paths: ['.migration/**', '.github/workflows/assistant-bootstrap.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: mastiha-assistant-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ESLINT_USE_FLAT_CONFIG: 'false'
      MASTIHA_HANDOFF_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: mastiha-assistant-integration-evidence
          run-id: 36465584409
          github-token: ${{ github.token }}
          path: /tmp/mastiha-recovery
      - name: Recover the already imported source and photographs
        run: |
          python3 - <<'PY'
          import tarfile,pathlib,shutil
          allowed={'src','public','messages','scripts','tests','docs','package.json','package-lock.json','next.config.ts','playwright.config.ts','tsconfig.json'}
          with tarfile.open('/tmp/mastiha-recovery/integration-source.tar.gz') as t:
            for member in t.getmembers():
              p=pathlib.PurePosixPath(member.name)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in allowed and not member.issym() and not member.islnk(),member.name
            t.extractall('.',filter='data')
          shutil.copytree('/tmp/mastiha-recovery/media-review/booking','media-review/booking',dirs_exist_ok=True)
          PY
      - name: Fix verified brand imports and narrow the HTML inert assertion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,urllib.request,json,base64,hashlib,xml.etree.ElementTree as ET,re
          marks=[]
          sources={'Facebook':'f66767e46165f562134ca2c2e3d4bea8f37fb1ac','Instagram':'c0e86b0bfc7b902c485699953dee878f290f575b'}
          for name,sha in sources.items():
            request=urllib.request.Request('https://api.github.com/repos/simple-icons/simple-icons/git/blobs/'+sha,headers={'User-Agent':'Mastiha-owner-authorized-build','Accept':'application/vnd.github+json'})
            data=json.load(urllib.request.urlopen(request,timeout=25))
            svg=base64.b64decode(data['content'])
            assert hashlib.sha1(b'blob '+str(len(svg)).encode()+b'\0'+svg).hexdigest()==sha
            paths=[p.attrib['d'] for p in ET.fromstring(svg).iter() if p.tag.endswith('path')]
            assert paths and all(re.fullmatch(r'[a-zA-Z0-9.,\s+\-]+',d) for d in paths)
            rendered=''.join('<path fill="currentColor" d="'+d+'" />' for d in paths)
            marks.append('export function '+name+'({size=24,...props}: SVGProps<SVGSVGElement> & {size?:number}) { return <svg viewBox="0 0 24 24" width={size} height={size} aria-hidden="true" {...props}>'+rendered+'</svg>; }')
          pathlib.Path('src/components/contact/SocialMarks.tsx').write_text('import type { SVGProps } from "react";\n// Verified Simple Icons CC0 paths. Marks identify channels, not sponsorship.\n'+'\n'.join(marks)+'\n')
          p=pathlib.Path('src/components/contact/SocialChannels.tsx');text=p.read_text();old="import { Facebook, Instagram, MessageCircle } from 'lucide-react';";assert old in text;p.write_text(text.replace(old,"import { MessageCircle } from 'lucide-react';\nimport { Facebook, Instagram } from './SocialMarks';"))
          p=pathlib.Path('tests/neighbourhood-assistant.spec.ts');text=p.read_text();old='evaluate(el => el.inert)';assert old in text;p.write_text(text.replace(old,'evaluate(el => el instanceof HTMLElement && el.inert)'))
          p=pathlib.Path('docs/NEIGHBOURHOOD-ASSISTANT.md');p.write_text(p.read_text()+'\nSocial brand paths: Simple Icons CC0, verified Facebook blob f66767e46165f562134ca2c2e3d4bea8f37fb1ac and Instagram blob c0e86b0bfc7b902c485699953dee878f290f575b. Brand marks do not imply endorsement.\n')
          source=json.loads(pathlib.Path('src/components/assistant/PROVENANCE.json').read_text())
          assert hashlib.sha256(pathlib.Path('src/components/assistant/chatbot.css').read_bytes()).hexdigest()==source['stylesheetSha256']
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:ui
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm audit --omit=dev --json > dependency-audit.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Publish validated changes to the working branch only
        run: |
          git fetch origin design/editorial-mastiha
          test "$(git rev-parse origin/design/editorial-mastiha)" = "$GITHUB_SHA"
          rm -rf .migration .assistant-source
          rm .github/workflows/assistant-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public scripts docs tests package.json package-lock.json .migration .github/workflows/assistant-bootstrap.yml
          git diff --cached --check
          git commit -m 'feat: add owner neighbourhood guide, faithful assistant port and Booking family media'
          git push origin HEAD:refs/heads/design/editorial-mastiha
          git rev-parse HEAD | tee VERIFIED_COMMIT.txt
      - name: Source and browser evidence
        if: always()
        run: |
          tar -czf integration-source.tar.gz src public messages scripts tests docs package.json package-lock.json next.config.ts playwright.config.ts tsconfig.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastiha-assistant-integration-evidence
          path: |
            test-results/
            playwright-report/
            media-review/booking/
            dependency-audit.json
            integration-source.tar.gz
            VERIFIED_COMMIT.txt
          retention-days: 7
