name: Integrate and verify Mastiha neighbourhood assistant
on:
  push:
    branches: [design/editorial-mastiha]
    paths: ['.migration/**', '.github/workflows/assistant-bootstrap.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: mastiha-assistant-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ESLINT_USE_FLAT_CONFIG: 'false'
      MASTIHA_HANDOFF_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: mastiha-assistant-integration-evidence
          run-id: 36466665439
          github-token: ${{ github.token }}
          path: /tmp/mastiha-recovery
      - name: Recover reviewed source and genuine Booking media
        run: |
          python3 - <<'PY'
          import tarfile,pathlib,shutil,hashlib,json
          allowed={'src','public','messages','scripts','tests','docs','package.json','package-lock.json','next.config.ts','playwright.config.ts','tsconfig.json'}
          with tarfile.open('/tmp/mastiha-recovery/integration-source.tar.gz') as t:
            for member in t.getmembers():
              p=pathlib.PurePosixPath(member.name)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in allowed and not member.issym() and not member.islnk(),member.name
            t.extractall('.',filter='data')
          shutil.copytree('/tmp/mastiha-recovery/media-review/booking','media-review/booking',dirs_exist_ok=True)
          source=json.loads(pathlib.Path('src/components/assistant/PROVENANCE.json').read_text())
          assert hashlib.sha256(pathlib.Path('src/components/assistant/chatbot.css').read_bytes()).hexdigest()==source['stylesheetSha256']
          PY
      - name: Fix API locale rewriting and add route-level regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/middleware.ts');s=p.read_text();old='(?!_next|_vercel|';assert old in s
          s=s.replace(old,'(?!api|_next|_vercel|');s=s.replace('export const config = {','// API routes are locale-independent JSON endpoints, never localized pages.\nexport const config = {');p.write_text(s)
          p=Path('docs/NEIGHBOURHOOD-ASSISTANT.md');p.write_text(p.read_text()+'\nAPI routing: next-intl middleware excludes /api. The locale stays in the validated JSON request, so POSTs are never redirected to a translated HTML page. Browser tests exercise the actual endpoints in all three languages.\n')
          PY
          cat >> tests/neighbourhood-assistant.spec.ts <<'TS'
          
          test('assistant API is not redirected into the locale router', async ({ request }) => {
            for (const locale of ['el', 'en', 'tr'] as const) {
              const response = await request.post('/api/assistant/chat', {
                maxRedirects: 0,
                headers: { 'Accept-Language': locale, 'x-forwarded-for': 'route-regression-' + locale },
                data: { locale, messages: [{ role: 'user', content: 'What is nearby?' }] },
              });
              expect(response.status()).toBe(200);
              expect(response.headers()['location']).toBeUndefined();
              expect(response.headers()['content-type']).toContain('application/json');
              expect(response.headers()['cache-control']).toContain('no-store');
              expect((await response.json()).reply).toContain('Market mou');
            }
          });
          TS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:ui
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm audit --omit=dev --json > dependency-audit.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Publish validated source to the working branch only
        run: |
          git fetch origin design/editorial-mastiha
          test "$(git rev-parse origin/design/editorial-mastiha)" = "$GITHUB_SHA"
          rm -rf .migration .assistant-source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public scripts docs tests package.json package-lock.json .migration
          git diff --cached --check
          git commit -m 'feat: integrate neighbourhood guide, original assistant UI and Booking family media'
          git push origin HEAD:refs/heads/design/editorial-mastiha
          git rev-parse HEAD | tee VERIFIED_COMMIT.txt
      - name: Source and browser evidence
        if: always()
        run: |
          tar -czf integration-source.tar.gz src public messages scripts tests docs package.json package-lock.json next.config.ts playwright.config.ts tsconfig.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastiha-assistant-integration-evidence
          path: |
            test-results/
            playwright-report/
            media-review/booking/
            dependency-audit.json
            integration-source.tar.gz
            VERIFIED_COMMIT.txt
          retention-days: 7
