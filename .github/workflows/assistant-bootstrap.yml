name: Integrate and verify Mastiha neighbourhood assistant
on:
  push:
    branches: [design/editorial-mastiha]
    paths: ['.migration/**', '.github/workflows/assistant-bootstrap.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: mastiha-assistant-integration
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ESLINT_USE_FLAT_CONFIG: 'false'
      MASTIHA_HANDOFF_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: mastiha-assistant-integration-evidence
          run-id: 36468264006
          github-token: ${{ github.token }}
          path: /tmp/mastiha-recovery
      - name: Recover the existing integration without changing donor styling
        run: |
          python3 - <<'PY'
          import tarfile,pathlib,shutil,hashlib,json
          allowed={'src','public','messages','scripts','tests','docs','package.json','package-lock.json','next.config.ts','playwright.config.ts','tsconfig.json'}
          with tarfile.open('/tmp/mastiha-recovery/integration-source.tar.gz') as t:
            for member in t.getmembers():
              p=pathlib.PurePosixPath(member.name)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in allowed and not member.issym() and not member.islnk(),member.name
            t.extractall('.',filter='data')
          shutil.copytree('/tmp/mastiha-recovery/media-review/booking','media-review/booking',dirs_exist_ok=True)
          source=json.loads(pathlib.Path('src/components/assistant/PROVENANCE.json').read_text())
          assert hashlib.sha256(pathlib.Path('src/components/assistant/chatbot.css').read_bytes()).hexdigest()==source['stylesheetSha256']
          PY
      - name: Apply explicit source fixes and host copy
        run: python3 .migration/finish-assistant.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:ui
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm audit --omit=dev --json > dependency-audit.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Publish the tested source to the working branch
        run: |
          git fetch origin design/editorial-mastiha
          test "$(git rev-parse origin/design/editorial-mastiha)" = "$GITHUB_SHA"
          rm -rf .migration .assistant-source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public scripts docs tests package.json package-lock.json .migration
          git diff --cached --check
          git commit -m 'feat: publish working chat, neighbourhood guide, Booking photos and host-voice copy'
          git push origin HEAD:refs/heads/design/editorial-mastiha
          git rev-parse HEAD | tee VERIFIED_COMMIT.txt
      - name: Source and browser evidence
        if: always()
        run: tar -czf integration-source.tar.gz src public messages scripts tests docs package.json package-lock.json next.config.ts playwright.config.ts tsconfig.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastiha-assistant-integration-evidence
          path: |
            test-results/
            playwright-report/
            media-review/booking/
            dependency-audit.json
            integration-source.tar.gz
            VERIFIED_COMMIT.txt
          retention-days: 7
