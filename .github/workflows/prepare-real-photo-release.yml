name: Prepare real photo release
on:
  push:
    branches: [design/editorial-mastiha]
    paths: ['scripts/finalize-listing-release.py', '.github/workflows/prepare-real-photo-release.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/design/editorial-mastiha'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ESLINT_USE_FLAT_CONFIG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python scripts/finalize-listing-release.py
      - run: npm run check:ui && npm run typecheck && npm run lint && npm run test:unit && npm run build
      - name: Commit prepared source only after build checks
        run: |
          test "$GITHUB_REF" = 'refs/heads/design/editorial-mastiha'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public scripts tests docs .github
          git add -u -- '*.mp4'
          git diff --cached --stat
          git commit -m 'release: replace synthetic media with real listing photos, enrich rooms and fix locale SEO'
          git push origin HEAD:refs/heads/design/editorial-mastiha
      - name: Review snapshot
        if: always()
        run: tar -czf candidate-source.tar.gz src public scripts tests docs .github package.json package-lock.json next.config.ts tsconfig.json playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-photo-candidate-source
          path: candidate-source.tar.gz
          retention-days: 7
