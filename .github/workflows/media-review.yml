name: Temporary listing media review
on:
  push:
    branches: [design/editorial-mastiha]
permissions:
  contents: write
jobs:
  audit:
    if: "!contains(github.event.head_commit.message, 'media: import curated listing photography')"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/editorial-mastiha
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/review-listing-media.mjs
      - run: node scripts/import-reviewed-photos.mjs media-review
      - name: Commit curated owner-authorized listing media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/photography/airbnb src/content/stay-media.generated.json
          if ! git diff --cached --quiet; then
            git commit -m 'media: import curated listing photography'
            git push origin HEAD:refs/heads/design/editorial-mastiha
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: all-airbnb-listing-media
          path: media-review/
          retention-days: 2
