name: Listing media audit
on:
  push:
    branches: [design/editorial-mastiha]
    paths: ['.github/workflows/listing-media-audit.yml', 'scripts/review-listing-media.mjs']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/review-listing-media.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listing-media-full-review
          path: media-review/
          retention-days: 7
